<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden – Kalio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="preload" href="fonts/public-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--bg:#FFFFFF;--bg-2:#F7F8FA;--ink:#101828;--mut:#475467;--line:#E4E7EC;--brand:#1E6FE0;--brand-strong:#1857B8;--brand-tint:#EAF5FF}
*{margin:0;padding:0;box-sizing:border-box}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
body{font-family:"Public Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:1.6}
.logo-svg{height:38px;width:auto;margin-bottom:34px}
.code{font-size:15px;font-weight:700;color:var(--brand-strong);background:var(--brand-tint);border-radius:99px;padding:7px 18px;display:inline-block;margin-bottom:18px}
h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;margin-bottom:12px}
p{color:var(--mut);font-size:16.5px;max-width:440px;margin-bottom:30px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:13px 26px;border-radius:99px}
.btn:hover{background:var(--brand-strong)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand-strong);background:#fff}
@media(prefers-reduced-motion:no-preference){
@keyframes upIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes leftIn{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes rightIn{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
.logo-svg{animation:upIn .55s cubic-bezier(.22,.7,.3,1) both}
.code{animation:leftIn .6s cubic-bezier(.22,.7,.3,1) .1s both}
h1{animation:rightIn .6s cubic-bezier(.22,.7,.3,1) .18s both}
p{animation:leftIn .6s cubic-bezier(.22,.7,.3,1) .26s both}
.btns{animation:upIn .6s cubic-bezier(.22,.7,.3,1) .36s both}
}
</style>
</head>
<body>
<svg class="logo-svg" viewBox="14 13 148 58" role="img" aria-label="kalio" xmlns="http://www.w3.org/2000/svg"><text x="18" y="66" style="font-family:'Public Sans',system-ui,sans-serif;font-weight:800;font-size:56px;letter-spacing:-0.03em" fill="#0F1E38">kalio</text><g transform="translate(134,42)"><path d="M0 12 C0 5.4 5.4 0 12 0 C18.6 0 24 5.4 24 12 C24 18.6 18.6 24 12 24 L2 24 L5 19.5 C1.9 17.3 0 14 0 12 Z" fill="#1E6FE0"/><circle cx="6.5" cy="12" r="2" fill="#fff"/><circle cx="12" cy="12" r="2" fill="#fff"/><circle cx="17.5" cy="12" r="2" fill="#fff"/></g></svg>
<span class="code">Fehler 404</span>
<h1>Diese Seite gibt es nicht (mehr)</h1>
<p>Die aufgerufene Adresse existiert nicht. Vielleicht hat sich ein Tippfehler eingeschlichen – oder die Seite wurde verschoben.</p>
<div class="btns">
  <a class="btn" href="/">Zur Startseite</a>
  <a class="btn ghost" href="/index.html#demo-anfrage">Demo anfragen</a>
</div>
</body>
</html>
